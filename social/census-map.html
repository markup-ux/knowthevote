<title>Leaders.vote · Census</title>
<style>
  :root {
    --paper: #f4f0e6;
    --ink: #1c1915;
    --muted: #5c564c;
    --bar: #0a3161;
    --stripe: #bf0a30;
    --bar-ink: #f4f7fb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #111; }
  .card {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--bar);
    color: var(--bar-ink);
    border-bottom: 6px solid var(--stripe);
    flex: none;
  }
  header .bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 36px 12px;
  }
  .brand {
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: 34px;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .section {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .stage {
    flex: 1;
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    min-height: 0;
  }
  .copy {
    padding: 28px 8px 24px 36px;
    display: flex;
    flex-direction: column;
  }
  h1 {
    margin: 0;
    font-family: Georgia, "Palatino Linotype", serif;
    font-weight: 500;
    font-size: 48px;
    line-height: 0.95;
    letter-spacing: -0.03em;
  }
  .count {
    margin: 18px 0 0;
    font-variant-numeric: tabular-nums;
    font-size: 28px;
    font-weight: 650;
    line-height: 1.15;
  }
  .count span { display: block; margin-top: 4px; font-size: 18px; font-weight: 400; color: var(--muted); }
  .legend {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: auto;
    font-size: 16px;
    color: var(--muted);
  }
  .swatches { display: flex; gap: 4px; }
  .swatches i { width: 18px; height: 14px; border: 1px solid var(--ink); display: block; }
  .url {
    margin: 14px 0 0;
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  #map { min-height: 0; display: flex; align-items: center; padding: 12px 28px 12px 0; }
  #map svg { width: 100%; height: 100%; display: block; }
  #map path { stroke: var(--ink); stroke-width: 0.8; stroke-linejoin: round; }
  #map text {
    font-family: "Segoe UI", sans-serif;
    font-weight: 650;
    fill: #1c1915;
    text-anchor: middle;
    dominant-baseline: central;
  }
  #map text.on-dark { fill: #f4f7fb; }
</style>

<body>
<article class="card">
  <header>
    <div class="bar">
      <div class="brand">leaders.vote</div>
      <div class="section">Census</div>
    </div>
  </header>
  <div class="stage">
    <div class="copy">
      <h1>National figures.</h1>
      <p class="count" id="count">341,784,857<span>people on July 1, 2025.</span></p>
      <div class="legend">
        <span class="swatches" id="swatches"></span>
        <span>Darker is more people.</span>
      </div>
      <p class="url">leaders.vote/census</p>
    </div>
    <div id="map" role="img" aria-label="Map of the states, colored by the Census Bureau population estimate for July 1, 2025. A darker state has more people."></div>
  </div>
</article>
<script>
(function () {
  var INK = ["#e8e0f7", "#c4b3ef", "#8b6ad4", "#5530a0", "#2a1458"];
  var box = document.getElementById("swatches");
  INK.forEach(function (color) {
    var mark = document.createElement("i");
    mark.style.background = color;
    box.appendChild(mark);
  });

  function band(value, list, count) {
    var below = 0;
    for (var i = 0; i < list.length; i++) if (list[i] < value) below++;
    return Math.min(count - 1, Math.floor(below / list.length * count));
  }

  function labelAt(path) {
    var code = path.getAttribute("data-code");
    var best = null;
    (path.getAttribute("d") || "").split(/[Mm]/).forEach(function (part) {
      var nums = part.match(/-?\d+(?:\.\d+)?/g);
      if (!nums || nums.length < 4) return;
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (var i = 0; i + 1 < nums.length; i += 2) {
        var px = +nums[i], py = +nums[i + 1];
        if (px < minX) minX = px;
        if (py < minY) minY = py;
        if (px > maxX) maxX = px;
        if (py > maxY) maxY = py;
      }
      var w = maxX - minX, h = maxY - minY;
      if (w < 1 || h < 1) return;
      var step = Math.max(1.5, Math.min(w, h) / 14);
      var n = 0, sx = 0, sy = 0;
      for (var gy = minY; gy <= maxY; gy += step) {
        for (var gx = minX; gx <= maxX; gx += step) {
          if (path.isPointInFill(new DOMPoint(gx, gy))) { n++; sx += gx; sy += gy; }
        }
      }
      if (!best || n > best.n) best = { n: n, x: n ? sx / n : (minX + maxX) / 2, y: n ? sy / n : (minY + maxY) / 2, w: w, h: h };
    });
    if (!best) return null;
    var size = Math.max(8, Math.min(13, Math.min(best.w, best.h) / 3.2));
    var x = best.x, y = best.y;
    if (code === "MD") { x = 826; y = 231; size = 10; }
    if (code === "DC") { x = 832; y = 245; size = 8; }
    if (code === "RI") { x = 916; y = 174; size = 8; }
    if (code === "FL") { x = 800; y = 500; }
    return { x: x, y: y, size: size };
  }

  Promise.all([
    fetch("../census/us.json").then(function (r) { return r.json(); }),
    fetch("../preview/us.svg").then(function (r) { return r.text(); })
  ]).then(function (pair) {
    var data = pair[0];
    var holder = document.getElementById("map");
    holder.innerHTML = pair[1];
    var svg = holder.querySelector("svg");
    svg.removeAttribute("width");
    svg.removeAttribute("height");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    var pops = data.states.map(function (state) { return state.pop; });
    var byCode = {};
    data.states.forEach(function (state) { byCode[state.code] = state; });
    svg.querySelectorAll("path[data-code]").forEach(function (path) {
      var state = byCode[path.getAttribute("data-code")];
      if (!state) return;
      var step = band(state.pop, pops, 5);
      path.setAttribute("fill", INK[step]);
      path.dataset.step = String(step);
    });
    svg.querySelectorAll("path[data-code]").forEach(function (path) {
      var spot = labelAt(path);
      var code = path.getAttribute("data-code");
      if (!spot || !code) return;
      var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", spot.x);
      text.setAttribute("y", spot.y);
      text.setAttribute("font-size", spot.size);
      if (Number(path.dataset.step) >= 2) text.setAttribute("class", "on-dark");
      text.textContent = code;
      svg.appendChild(text);
    });
    document.getElementById("count").innerHTML = data.nation.pop.toLocaleString("en-US") + "<span>people on July 1, 2025.</span>";
    document.documentElement.dataset.ready = "1";
  });
})();
</script>
</body>
