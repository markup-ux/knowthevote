<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaders.vote · Shop</title>
<style>
  :root {
    --paper: #f4f0e6;
    --ink: #1c1915;
    --muted: #5c564c;
    --bar: #0a3161;
    --stripe: #bf0a30;
    --bar-ink: #f4f7fb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #111; }
  .card {
    width: 1080px;
    height: 1350px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header { background: var(--bar); color: var(--bar-ink); border-bottom: 8px solid var(--stripe); flex: none; }
  header .bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 40px 14px;
  }
  .brand {
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: 36px;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .section {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .stage { flex: 1; min-height: 0; padding: 22px 40px 8px; display: flex; flex-direction: column; }
  .kicker {
    margin: 0;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 15px;
    font-weight: 650;
    color: var(--muted);
  }
  h1 {
    margin: 6px 0 0;
    font-family: Georgia, "Palatino Linotype", serif;
    font-weight: 500;
    font-size: 64px;
    line-height: 0.95;
    letter-spacing: -0.03em;
  }
  .deck { margin: 12px 0 0; font-size: 24px; line-height: 1.28; max-width: 46ch; }
  .grid {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px 14px;
  }
  figure { margin: 0; }
  figure img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    display: block;
    background: #fff;
    border: 1px solid var(--ink);
  }
  figcaption { margin-top: 6px; font-size: 16px; line-height: 1.2; }
  figcaption strong { display: block; font-size: 17px; }
  figcaption span { color: var(--muted); }
  .panel { flex: none; border-top: 1px solid var(--ink); padding: 14px 40px 16px; }
  .url {
    margin: 0;
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  .note { margin: 4px 0 0; font-size: 16px; line-height: 1.3; color: var(--muted); }
</style>
</head>
<body>
<article class="card">
  <header>
    <div class="bar">
      <div class="brand">leaders.vote</div>
      <div class="section">Shop</div>
    </div>
  </header>
  <div class="stage">
    <p class="kicker">Through November 16, 2026</p>
    <h1>Trashed Panda.</h1>
    <p class="deck">The shelter's line, sold on Bonfire. The money goes to Hanover County Animal Protection and Shelter. Leaders.vote does not take payment.</p>
    <div class="grid">
      <figure>
        <img src="../shop/hoodie.jpg" alt="Sport grey pullover hoodie.">
        <figcaption><strong>Hoodie</strong><span>Sport Grey · $41.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/classic-tee-jade.jpg" alt="Jade dome classic tee.">
        <figcaption><strong>Classic tee</strong><span>Jade Dome · $24.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/premium-tee-baby-blue.jpg" alt="Heather baby blue premium tee.">
        <figcaption><strong>Premium tee</strong><span>Heather Baby Blue · $27.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/vneck-mauve.jpg" alt="Heather mauve v-neck tee.">
        <figcaption><strong>V-neck</strong><span>Heather Mauve · $27.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/classic-long-orange.jpg" alt="Orange classic long sleeve.">
        <figcaption><strong>Long sleeve</strong><span>Orange · $29.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/long-sleeve-clay.jpg" alt="Heather clay premium long sleeve.">
        <figcaption><strong>Premium long sleeve</strong><span>Heather Clay · $32.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/sweatshirt-light-pink.jpg" alt="Light pink sweatshirt.">
        <figcaption><strong>Sweatshirt</strong><span>Light Pink · $39.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/hat-red.jpg" alt="Red snapback hat.">
        <figcaption><strong>Snapback</strong><span>Red · $36.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/cap-navy.jpg" alt="Navy Nike cap.">
        <figcaption><strong>Nike cap</strong><span>Navy · $47.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/sticker.jpg" alt="White kiss-cut sticker.">
        <figcaption><strong>Sticker</strong><span>White · $4.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/tumbler.jpg" alt="White insulated tumbler.">
        <figcaption><strong>Tumbler</strong><span>White · $35.99</span></figcaption>
      </figure>
      <figure>
        <img src="../shop/mug.jpg" alt="White travel mug.">
        <figcaption><strong>Travel mug</strong><span>White · $32.99</span></figcaption>
      </figure>
    </div>
  </div>
  <div class="panel">
    <p class="url">leaders.vote/shop</p>
    <p class="note">Ends Monday, November 16, at 11:00 p.m. Central. Photos: Bonfire.</p>
  </div>
</article>
</body>
</html>
