name: Update country election files

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: country-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recopy official place totals
        run: |
          git config user.name "leaders-results"
          git config user.email "actions@leaders.vote"
          python scripts/build_more.py
          git add -- countries.html br se ch sk cy de au flags/deu.svg flags/au.svg flags/br.svg flags/se.svg flags/ch.svg flags/sk.svg
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Update country pages from the official election files."
            git push
          fi
