name: Watch House roll calls

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: house-roll-calls
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy new House roll calls
        run: |
          git config user.name "leaders-results"
          git config user.email "actions@leaders.vote"
          python congress/build.py --new
          git add -- congress/votes.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Update House roll calls."
            git pull --rebase origin main
            git push
          fi
