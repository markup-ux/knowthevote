name: Update election results

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh unofficial totals
        run: |
          python scripts/build_results.py
          python scripts/build_leads.py --fetch
          python scripts/build_preview.py --results
      - name: Publish the totals file
        run: |
          git diff --quiet -- results.json preview/leads.json preview/states && exit 0
          git config user.name "leaders-results"
          git config user.email "actions@leaders.vote"
          git add results.json preview/leads.json preview/states
          git commit -m "Update unofficial election totals."
          git push
