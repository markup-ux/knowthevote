name: Update Group Chat posts

on:
  schedule:
    # GitHub often starts this hours late. The job keeps copying for about
    # six hours and publishes each new post at a fresh address.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CHAT_POSTS_BUDGET_MINUTES: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy official social posts
        run: |
          git config user.name "leaders-results"
          git config user.email "actions@leaders.vote"
          python scripts/update_chat_posts.py
