name: Update the gallery

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-photos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add photographs Unsplash has published
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          git config user.name "leaders-results"
          git config user.email "actions@leaders.vote"
          python scripts/update_gallery.py
          git add -- gallery-photos.json gallery-sync.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Add Unsplash photographs published since the last gallery update."
            git push
          fi
