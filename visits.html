<script>try{var t=localStorage.getItem("leaders-theme");if(t&&t!=="light")document.documentElement.setAttribute("data-theme",t);var raw=localStorage.getItem("leaders-look");if(raw){var o=JSON.parse(raw),el=document.documentElement,css="",st=document.createElement("style");function hex(v){return typeof v==="string"&&/^#[0-9a-fA-F]{6}$/.test(v)?v:""}function lum(h){var n=parseInt(h.slice(1),16);return (((n>>16)&255)*3+((n>>8)&255)*6+(n&255))/10}function face(v){return typeof v==="string"&&v.length>0&&v.length<80?v:""}var body=face(o.body),display=face(o.display),paper=hex(o.paper),ink=hex(o.ink),bar=hex(o.bar),stripe=hex(o.stripe);if(body){el.style.setProperty("--look-body",body);el.classList.add("look-body");css+="html.look-body body{font-family:var(--look-body)}"}if(display){el.style.setProperty("--look-display",display);el.classList.add("look-display");css+="html.look-display h1,html.look-display h2,html.look-display h3,html.look-display .brand{font-family:var(--look-display)}"}if(paper){el.style.setProperty("--look-paper",paper);el.classList.add("look-paper");css+="html.look-paper{--paper:var(--look-paper)}"}if(ink){el.style.setProperty("--look-ink",ink);el.classList.add("look-ink");css+="html.look-ink{--ink:var(--look-ink)}"}if(bar){el.style.setProperty("--look-bar",bar);el.style.setProperty("--look-bar-ink",lum(bar)>150?"#1c1915":"#f4f7fb");el.classList.add("look-bar");css+="html.look-bar body{--bar:var(--look-bar);--bar-ink:var(--look-bar-ink)}"}if(stripe){el.style.setProperty("--look-stripe",stripe);el.classList.add("look-stripe");css+="html.look-stripe body{--bar-stripe:var(--look-stripe);--bar-hover:var(--look-stripe)}"}if(css){st.textContent=css;document.head.appendChild(st)}}}catch(e){}</script>

<meta charset="utf-8">

<header>
  <div class="wrap bar">
    <a class="brand notranslate" href="index.html" translate="no">Leaders.vote</a>
  </div>
</header>
<main class="wrap">
  <h1>Page loads</h1>
  <p class="quiet">This counts opens of a page on leaders.vote. It does not count people, and it does not keep a cookie, a browser identifier, or an address. There is nothing to accept. Opening this page does not add to the count.</p>
  <p class="quiet">All pages</p>
  <p class="loads" id="total">…</p>
  <p class="quiet" id="status">Checking the counter.</p>
  <table class="rows">
    <tbody id="rows"></tbody>
  </table>
</main>
<script src="visit.js?v=1"></script>
<script>
(function () {
  var api = window.leadersVisits;
  var statusEl = document.getElementById("status");
  var rowsEl = document.getElementById("rows");
  var rows = [
    { id: "today", label: "Today, US Central", name: function () { return "day-" + api.day(0); } },
    { id: "yesterday", label: "Yesterday", name: function () { return "day-" + api.day(-1); } }
  ].concat(api.sections.map(function (pair) {
    return { id: pair[0], label: pair[1], name: function () { return pair[0]; } };
  }));

  rows.forEach(function (row) {
    var tr = document.createElement("tr");
    var label = document.createElement("th");
    var value = document.createElement("td");
    label.textContent = row.label;
    label.scope = "row";
    value.id = "count-" + row.id;
    value.textContent = "…";
    tr.appendChild(label);
    tr.appendChild(value);
    rowsEl.appendChild(tr);
  });

  function format(value) {
    var number = Number(value);
    if (!isFinite(number)) return "0";
    return number.toLocaleString("en-US");
  }

  function read(name) {
    return fetch(api.origin + "get/" + encodeURIComponent(api.key(name)), {
      credentials: "omit",
      cache: "no-store",
      referrerPolicy: "no-referrer"
    }).then(function (response) {
      if (response.status === 404) return 0;
      if (!response.ok) throw new Error("status");
      return response.json().then(function (body) { return Number(body.value) || 0; });
    });
  }

  function refresh() {
    Promise.all([read("total")].concat(rows.map(function (row) { return read(row.name()); }))).then(function (values) {
      document.getElementById("total").textContent = format(values[0]);
      rows.forEach(function (row, index) {
        document.getElementById("count-" + row.id).textContent = format(values[index + 1]);
      });
      statusEl.textContent = "Updated " + new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Chicago",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date()) + " US Central. This page checks again every few seconds.";
    }).catch(function () {
      statusEl.textContent = "The counter did not answer. This page will try again.";
    });
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
